# fly.toml — 247 Claude Code Remote (Agent + Web unificado)
# Deploy: cd claude-remote-control && fly deploy
app = "247-claude-code-remote"
primary_region = "dfw"

[build]
  dockerfile = "./Dockerfile"

[env]
  NODE_ENV     = "production"
  HOME         = "/root"
  PORT         = "4678"
  # OPENROUTER_API_KEY → configurar con: fly secrets set OPENROUTER_API_KEY=sk-or-xxx
  # ANTHROPIC_API_KEY  → configurar con: fly secrets set ANTHROPIC_API_KEY=sk-ant-xxx
  # OLLAMA_BASE_URL    → solo si usas Ollama externo, ej: http://mi-servidor:11434

[http_service]
  internal_port       = 8080
  force_https         = true
  auto_stop_machines  = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type       = "requests"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory   = "1gb"
  cpu_kind = "shared"
  cpus     = 1

[[mounts]]
  source       = "agent_data"
  destination  = "/root/.247/data"
  initial_size = "1gb"
