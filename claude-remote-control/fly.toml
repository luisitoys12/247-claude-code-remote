# fly.toml — 247 Claude Code Remote (Agent + Ollama)
# Deploy: cd claude-remote-control && fly deploy
#
# Secrets:
#   fly secrets set OPENROUTER_API_KEY="sk-or-xxx"
#   fly secrets set DEFAULT_OLLAMA_MODEL="qwen2.5-coder:7b"
#
app = "247-claude-code-remote"
primary_region = "dfw"

[build]
  dockerfile = "./Dockerfile"

[env]
  NODE_ENV         = "production"
  HOME             = "/root"
  PORT             = "4678"
  OLLAMA_HOST      = "127.0.0.1:11434"
  OLLAMA_BASE_URL  = "http://127.0.0.1:11434"
  # Agent data stored inside the same volume at /data/data
  AGENT_DATA_DIR   = "/data/agent"

[http_service]
  internal_port        = 8080
  force_https          = true
  auto_stop_machines   = "stop"
  auto_start_machines  = true
  min_machines_running = 0

  [http_service.concurrency]
    type       = "requests"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory   = "2gb"
  cpu_kind = "shared"
  cpus     = 2

# Solo 1 volumen permitido — contiene tanto los modelos Ollama como los datos del agent
[[mounts]]
  source       = "ollama_models"
  destination  = "/data"
  initial_size = "20gb"
