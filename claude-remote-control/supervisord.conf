[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

; ── 1. Ollama API server (interno :11434) ──────────────────────
[program:ollama]
command=/usr/local/bin/ollama serve
autostart=true
autorestart=true
startretries=5
stdout_logfile=/var/log/supervisor/ollama.log
stderr_logfile=/var/log/supervisor/ollama-err.log
environment=HOME="/root",OLLAMA_HOST="127.0.0.1:11434",OLLAMA_MODELS="/root/.ollama/models"
priority=5

; ── 2. Agent Node.js (:4678) ───────────────────────────────────
[program:agent]
command=node /app/apps/agent/dist/index.js
directory=/app/apps/agent
autostart=true
autorestart=true
startretries=5
stdout_logfile=/var/log/supervisor/agent.log
stderr_logfile=/var/log/supervisor/agent-err.log
environment=NODE_ENV="production",PORT="4678",HOME="/root"
priority=10

; ── 3. Web Next.js (:3000) ─────────────────────────────────────
[program:web]
command=node /app/apps/web/node_modules/.bin/next start -p 3000
directory=/app/apps/web
autostart=true
autorestart=true
startretries=5
stdout_logfile=/var/log/supervisor/web.log
stderr_logfile=/var/log/supervisor/web-err.log
environment=NODE_ENV="production",PORT="3000",OLLAMA_BASE_URL="http://127.0.0.1:11434"
priority=20

; ── 4. Nginx reverse proxy (:8080 público) ─────────────────────
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=3
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx-err.log
priority=30
