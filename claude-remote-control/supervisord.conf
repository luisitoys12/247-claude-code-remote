[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

; ── 1. Ollama API server (interno :11434) ──────────────────────────────────
[program:ollama]
command=/usr/local/bin/ollama serve
autostart=true
autorestart=true
startretries=5
stdout_logfile=/var/log/supervisor/ollama.log
stderr_logfile=/var/log/supervisor/ollama-err.log
environment=HOME="/root",OLLAMA_HOST="127.0.0.1:11434",OLLAMA_MODELS="/data/.ollama/models"
priority=5

; ── 2. Agent Node.js (:4678) ────────────────────────────────────────────
[program:agent]
command=node /app/apps/agent/dist/index.js
directory=/app/apps/agent
autostart=true
autorestart=true
startretries=5
stdout_logfile=/var/log/supervisor/agent.log
stderr_logfile=/var/log/supervisor/agent-err.log
environment=NODE_ENV="production",PORT="4678",HOME="/root",AGENT_DATA_DIR="/data/agent"
priority=10

; ── 3. Open WebUI (:3000) ──────────────────────────────────────────
[program:web]
command=/opt/webui-venv/bin/open-webui serve --host 127.0.0.1 --port 3000
autostart=true
autorestart=true
startretries=5
startsecs=5
stdout_logfile=/var/log/supervisor/web.log
stderr_logfile=/var/log/supervisor/web-err.log
environment=OLLAMA_BASE_URL="http://127.0.0.1:11434",DATA_DIR="/data/webui",WEBUI_AUTH="True",HOME="/root",PATH="/opt/webui-venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
priority=20

; ── 4. Nginx reverse proxy (:8080 publico) ───────────────────────────
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=3
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx-err.log
priority=30
